[project]
name = "analytics-lab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jiwer>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Local smoke transcription only (macOS/MLX + ElevenLabs). Not required for CI.
smoke = [
    "mlx-whisper>=0.4.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_benchmark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
